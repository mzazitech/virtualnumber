    /* Sections */

    .hero h1 {

      background: linear-gradient(135deg, #FFFFFF, #A0F0C0);

    .hero-sub {

    .countries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;

    .country-card {

      border-color: #2ECC71;

    .country-info {

    .flag-icon {

    .country-details h3 {

    .country-code {

    .price-buy {

    .buy-btn {

      transition: 0.2s;

    }
    .buy-btn:hover {
      background: #2ECC71;
      color: #0A0C10;
    }
    .no-results {
      text-align: center;
      padding: 50px;
      color: #94a3b8;
      grid-column: 1/-1;
    }

    /* Contact Section */
    .contact-container {
      max-width: 700px;
      margin: 40px auto 60px;
      background: #0F131C;
      border-radius: 40px;
      padding: 45px 35px;
      text-align: center;
      border: 1px solid #262E3C;
    }
    .contact-icon {
      font-size: 3.5rem;
      color: #25D366;
    }
    .contact-wa {
      background: #1f2a36;
      padding: 15px 25px;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 20px 0;
    }
    .contact-wa i {
      color: #25D366;
    }

    .footer {
      border-top: 1px solid #1E293B;
      text-align: center;
      padding: 30px 20px;
      color: #8A99B4;
      font-size: 0.85rem;
    }
    .footer-links a {
      color: #9CABCA;
      text-decoration: none;
      margin: 0 8px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        background: #0E121C;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        padding: 24px;
        gap: 20px;
        border-bottom: 1px solid #2A3647;
      }
      .nav-links.show {
        display: flex;
      }
      .menu-icon {
        display: block;
      }
      .hero h1 {
        font-size: 1.8rem;
      }
      .countries-grid {
        grid-template-columns: 1fr;
      }
      .country-card {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .price-buy {
        text-align: right;
      }
      .section {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Floating WhatsApp Button (all pages) -->
  <a href="https://wa.me/254741388986?text=Hello%20I%20want%20to%20buy%20a%20virtual%20number" class="whatsapp-float" target="_blank" rel="noopener noreferrer">

  <!-- Navigation -->
  <nav class="navbar">

      <div class="menu-icon" id="menuToggle">

  <!-- Dynamic Content Container -->
  <main id="app-root"></main>

  <footer class="footer">

    <div class="footer-links">
      <a data-page="home">Home</a> | 
      <a data-page="pricing">Pricing</a> | 
      <a data-page="contact">Contact</a>
    </div>
  </footer>

  <script>
    // ---------- COUNTRIES DATABASE ----------
    const countriesList = [
      { name: "Kenya", code: "+254", price: 100, currency: "KSh", flag: "🇰🇪" },
      { name: "Uganda", code: "+256", price: 120, currency: "KSh", flag: "🇺🇬" },
      { name: "Tanzania", code: "+255", price: 120, currency: "KSh", flag: "🇹🇿" },
      { name: "Nigeria", code: "+234", price: 150, currency: "KSh", flag: "🇳🇬" },
      { name: "Ghana", code: "+233", price: 150, currency: "KSh", flag: "🇬🇭" },
      { name: "United States", code: "+1", price: 250, currency: "KSh", flag: "🇺🇸" },
      { name: "United Kingdom", code: "+44", price: 300, currency: "KSh", flag: "🇬🇧" },
      { name: "Canada", code: "+1", price: 300, currency: "KSh", flag: "🇨🇦" },
      { name: "India", code: "+91", price: 200, currency: "KSh", flag: "🇮🇳" },
      { name: "Pakistan", code: "+92", price: 200, currency: "KSh", flag: "🇵🇰" },
      { name: "Indonesia", code: "+62", price: 200, currency: "KSh", flag: "🇮🇩" },
      { name: "Bangladesh", code: "+880", price: 200, currency: "KSh", flag: "🇧🇩" },
      { name: "Philippines", code: "+63", price: 220, currency: "KSh", flag: "🇵🇭" },
      { name: "China", code: "+86", price: 300, currency: "KSh", flag: "🇨🇳" },
      { name: "Germany", code: "+49", price: 350, currency: "KSh", flag: "🇩🇪" },
      { name: "France", code: "+33", price: 350, currency: "KSh", flag: "🇫🇷" },
      { name: "Ukraine", code: "+380", price: 300, currency: "KSh", flag: "🇺🇦" },
      { name: "Russia", code: "+7", price: 300, currency: "KSh", flag: "🇷🇺" }
    ];

    const WHATSAPP_LINK = "https://wa.me/254741388986?text=Hello%20I%20want%20to%20buy%20a%20virtual%20number";

    // Helper to update active nav
    function setActiveNav(pageId) {
      document.querySelectorAll('.nav-link').forEach(link => {
        if (link.getAttribute('data-page') === pageId) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // Render Home Page
    function renderHome() {
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <section class="hero">
          <div class="hero-content">
            <h1>Buy WhatsApp Virtual Numbers Instantly</h1>
            <p class="hero-sub">Fast, Secure & Affordable Verification Numbers</p>
            <button class="btn-glow" id="orderNowBtn">Order Now <i class="fas fa-arrow-right"></i></button>
          </div>
          <div class="hero-stats">
            <div class="stat"><i class="fas fa-check-circle"></i> Instant delivery</div>
            <div class="stat"><i class="fas fa-shield-alt"></i> Secure & private</div>
            <div class="stat"><i class="fas fa-globe"></i> 20+ countries</div>
          </div>
        </section>
        <div class="section">
          <div class="features-preview">
            <div class="feature-card"><i class="fas fa-bolt"></i><h3>Lightning Fast</h3><p>Get your virtual number in minutes</p></div>
            <div class="feature-card"><i class="fas fa-headset"></i><h3>24/7 Support</h3><p>Real human assistance on WhatsApp</p></div>
            <div class="feature-card"><i class="fas fa-money-bill-wave"></i><h3>Best Prices</h3><p>Competitive rates across all regions</p></div>
          </div>
          <div class="preview-label"><i class="fas fa-list-ul"></i> Popular destinations</div>
          <div class="country-strip">
            <span>🇰🇪 Kenya +254</span> <span>🇺🇬 Uganda +256</span> <span>🇹🇿 Tanzania +255</span>
            <span>🇳🇬 Nigeria +234</span> <span>🇺🇸 USA +1</span> <span>🇬🇧 UK +44</span>
          </div>
        </div>
      `;
      const orderBtn = document.getElementById('orderNowBtn');
      if (orderBtn) orderBtn.addEventListener('click', () => navigateTo('pricing'));
      setActiveNav('home');
    }

    // Render Pricing Page with search + radio-style country cards
    function renderPricing(searchTerm = "") {
      const root = document.getElementById('app-root');
      const filtered = countriesList.filter(c => 
        c.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
        c.code.includes(searchTerm)
      );
      
      const gridHtml = filtered.map(country => `
        <div class="country-card">
          <div class="country-info">
            <span class="flag-icon">${country.flag}</span>
            <div class="country-details">
              <h3>${country.name}</h3>
              <div class="country-code">${country.code}</div>
            </div>
          </div>
          <div class="price-buy">
            <div class="price">${country.currency} ${country.price}</div>
            <button class="buy-btn" data-name="${country.name}" data-code="${country.code}">Buy Now →</button>
          </div>
        </div>
      `).join('');
      
      const noResultsHtml = filtered.length === 0 ? `<div class="no-results"><i class="fas fa-search"></i> No matching countries</div>` : '';
      
      root.innerHTML = `
        <div class="section">
          <div class="pricing-header">
            <h2>📞 Select Your Virtual Number</h2>
            <p style="color:#A5B4D0;">Click "Buy Now" — Instant WhatsApp delivery</p>
          </div>
          <div class="search-section">
            <input type="text" class="search-box" id="countrySearchInput" placeholder="🔍 Search country or code (e.g., Kenya, +254)" autocomplete="off">
          </div>
          <div class="countries-grid" id="dynamicCountriesGrid">
            ${gridHtml}
            ${noResultsHtml}
          </div>
        </div>
      `;
      
      // attach search live filter
      const searchInput = document.getElementById('countrySearchInput');
      if (searchInput) {
        searchInput.value = searchTerm;
        searchInput.addEventListener('input', (e) => {
          renderPricing(e.target.value);
        });
      }
      
      // attach buy buttons to WhatsApp redirect
      document.querySelectorAll('.buy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          window.open(WHATSAPP_LINK, '_blank');
        });
      });
      setActiveNav('pricing');
    }

    // Render Contact Page
    function renderContact() {
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="section">
          <div class="contact-container">
            <i class="fab fa-whatsapp contact-icon"></i>
            <h2 style="margin-top: 15px;">Connect With Us</h2>
            <div class="contact-wa">
              <i class="fab fa-whatsapp"></i> +254741388986
            </div>
            <p style="font-size: 1.1rem; font-weight:500;">MZAZI TECH VIRTUAL NUMBERS</p>
            <p style="margin-top: 20px; color:#8CA3C2;">Fast virtual numbers for WhatsApp verification. Reliable support 24/7 via WhatsApp.</p>
            <a href="${WHATSAPP_LINK}" target="_blank" class="btn-glow" style="margin-top: 28px; display: inline-flex;">Chat on WhatsApp <i class="fab fa-whatsapp"></i></a>
          </div>
        </div>
      `;
      setActiveNav('contact');
    }

    // Navigation logic
    let currentPage = 'home';
    
    function navigateTo(page) {
      currentPage = page;
      if (page === 'home') renderHome();
      else if (page === 'pricing') renderPricing('');
      else if (page === 'contact') renderContact();
      // close mobile menu if open
      const navMenu = document.getElementById('navLinks');
      if (navMenu && navMenu.classList.contains('show')) {
        navMenu.classList.remove('show');
      }
      // update URL hash without reload
      window.history.pushState({ page }, '', `#${page}`);
    }
    
    // Handle initial load and hash change
    function handleRoute() {
      const hash = window.location.hash.slice(1); // remove #
      if (hash === 'pricing') navigateTo('pricing');
      else if (hash === 'contact') navigateTo('contact');
      else navigateTo('home');
    }
    
    // Event listeners for navigation links
    function bindNavEvents() {
      const navLinks = document.querySelectorAll('[data-page]');
      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const page = link.getAttribute('data-page');
          if (page) navigateTo(page);
        });
      });
    }
    
    // Mobile menu toggle
    function initMobileMenu() {
      const menuBtn = document.getElementById('menuToggle');
      const navLinksContainer = document.getElementById('navLinks');
      if (menuBtn && navLinksContainer) {
        menuBtn.addEventListener('click', () => {
          navLinksContainer.classList.toggle('show');
        });
        // close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
          link.addEventListener('click', () => {
            navLinksContainer.classList.remove('show');
          });
        });
      }
    }
    
    // When page loads
    window.addEventListener('DOMContentLoaded', () => {
      initMobileMenu();
      bindNavEvents();
      handleRoute();
    });
    
    // Handle browser back/forward
    window.addEventListener('popstate', () => {
      handleRoute();
    });
  </script>
</body>
