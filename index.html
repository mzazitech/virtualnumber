    .menu-icon {

    /* Buttons & cards */

    .countries-grid {

      gap: 24px;

      margin: 0 auto;

    .country-card {
      background: #12161F;

    .country-info {

    .country-details h3 {

    .country-code {

    .price-buy {

    .price {

    }
    .buy-btn {

      color: #2ECC71;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
    }
    .buy-btn:hover {
      background: #2ECC71;
      color: #0A0C10;
    }
    .no-results {

    /* Contact page */
    .contact-container {

    .contact-wa {
      background: #1f2a36;
      padding: 15px;

    .contact-wa i {

    /* radio selector for country (like whatsapp style) used on pricing */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        background: #0E121C;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        padding: 24px;
        gap: 20px;
        border-bottom: 1px solid #2A3647;
      }
      .nav-links.show {
        display: flex;
      }
      .menu-icon {
        display: block;
      }
      .hero h1 {
        font-size: 1.8rem;
      }
      .countries-grid {
        grid-template-columns: 1fr;
        padding: 20px 16px;
      }
      .country-card {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .price-buy {
        text-align: right;
      }
    }
  </style>
</head>
<body>

  <script>
    // ---------- COUNTRIES DATA ----------
    const countriesList = [
      { name: "Kenya", code: "+254", price: 100, currency: "KSh", flag: "🇰🇪" },
      { name: "Uganda", code: "+256", price: 120, currency: "KSh", flag: "🇺🇬" },
      { name: "Tanzania", code: "+255", price: 120, currency: "KSh", flag: "🇹🇿" },
      { name: "Nigeria", code: "+234", price: 150, currency: "KSh", flag: "🇳🇬" },
      { name: "Ghana", code: "+233", price: 150, currency: "KSh", flag: "🇬🇭" },
      { name: "United States", code: "+1", price: 250, currency: "KSh", flag: "🇺🇸" },
      { name: "United Kingdom", code: "+44", price: 300, currency: "KSh", flag: "🇬🇧" },
      { name: "Canada", code: "+1", price: 300, currency: "KSh", flag: "🇨🇦" },
      { name: "India", code: "+91", price: 200, currency: "KSh", flag: "🇮🇳" },
      { name: "Pakistan", code: "+92", price: 200, currency: "KSh", flag: "🇵🇰" },
      { name: "Indonesia", code: "+62", price: 200, currency: "KSh", flag: "🇮🇩" },
      { name: "Bangladesh", code: "+880", price: 200, currency: "KSh", flag: "🇧🇩" },
      { name: "Philippines", code: "+63", price: 220, currency: "KSh", flag: "🇵🇭" },
      { name: "China", code: "+86", price: 300, currency: "KSh", flag: "🇨🇳" },
      { name: "Germany", code: "+49", price: 350, currency: "KSh", flag: "🇩🇪" },
      { name: "France", code: "+33", price: 350, currency: "KSh", flag: "🇫🇷" },
      { name: "Ukraine", code: "+380", price: 300, currency: "KSh", flag: "🇺🇦" },
      { name: "Russia", code: "+7", price: 300, currency: "KSh", flag: "🇷🇺" }
    ];

    const WHATSAPP_LINK = "https://wa.me/254741388986?text=Hello%20I%20want%20to%20buy%20a%20virtual%20number";

    function renderPricingPage(searchTerm = "") {
      const container = document.getElementById("page-content");
      if (!container) return;
      const filtered = countriesList.filter(c => 
        c.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
        c.code.includes(searchTerm)
      );
      const gridHtml = filtered.map(country => `
        <div class="country-card" data-country="${country.name}">
          <div class="country-info">
            <span class="flag-icon">${country.flag}</span>
            <div class="country-details">
              <h3>${country.name}</h3>
              <div class="country-code">${country.code}</div>
            </div>
          </div>
          <div class="price-buy">
            <div class="price">${country.currency} ${country.price}</div>
            <button class="buy-btn" data-code="${country.code}" data-name="${country.name}">Buy Now →</button>
          </div>
        </div>
      `).join("");
      
      const noResults = filtered.length === 0 ? `<div class="no-results"><i class="fas fa-search"></i> No matching countries</div>` : "";
      container.innerHTML = `
        <div class="pricing-header">
          <h1>📞 Choose Your Virtual Number</h1>
          <p style="color:#A5B4D0;">Select country & click Buy Now — Instant WhatsApp delivery</p>
        </div>
        <div class="search-section">
          <input type="text" class="search-box" id="countrySearch" placeholder="🔍 Search country or code (e.g., Kenya, +254)" autocomplete="off">
        </div>
        <div class="countries-grid" id="countriesGrid">
          ${gridHtml}
          ${noResults}
        </div>
      `;
      // attach search event
      const searchInput = document.getElementById("countrySearch");
      if (searchInput) {
        searchInput.value = searchTerm;
        searchInput.addEventListener("input", (e) => {
          renderPricingPage(e.target.value);
        });
      }
      // attach buy buttons
      document.querySelectorAll(".buy-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          window.open(WHATSAPP_LINK, "_blank");
        });
      });
    }

    function renderContactPage() {
      const container = document.getElementById("page-content");
      if (!container) return;
      container.innerHTML = `
        <div class="contact-container">
          <i class="fab fa-whatsapp contact-icon"></i>
          <h2 style="margin-top: 15px;">Connect With Us</h2>
          <div class="contact-wa">
            <i class="fab fa-whatsapp"></i> +254741388986
          </div>
          <p style="font-size: 1.1rem; font-weight:500;">MZAZI TECH VIRTUAL NUMBERS</p>
          <p style="margin-top: 20px; color:#8CA3C2;">Fast virtual numbers for WhatsApp verification. Reliable support 24/7 via WhatsApp.</p>
          <a href="${WHATSAPP_LINK}" target="_blank" class="btn-glow" style="margin-top: 28px; display: inline-flex;">Chat on WhatsApp <i class="fab fa-whatsapp"></i></a>
        </div>
      `;
    }

    function renderHomePage() {
      const container = document.getElementById("page-content");
      if (!container) return;
      container.innerHTML = `
        <main>
          <section class="hero">
            <div class="hero-content">
              <h1>Buy WhatsApp Virtual Numbers Instantly</h1>
              <p class="hero-sub">Fast, Secure & Affordable Verification Numbers</p>
              <a href="pricing.html" class="btn-glow">Order Now <i class="fas fa-arrow-right"></i></a>
            </div>
            <div class="hero-stats">
              <div class="stat"><i class="fas fa-check-circle"></i> Instant delivery</div>
              <div class="stat"><i class="fas fa-shield-alt"></i> Secure & private</div>
              <div class="stat"><i class="fas fa-globe"></i> 20+ countries</div>
            </div>
          </section>
          <section class="features-preview">
            <div class="feature-card"><i class="fas fa-bolt"></i><h3>Lightning Fast</h3><p>Get your virtual number in minutes</p></div>
            <div class="feature-card"><i class="fas fa-headset"></i><h3>24/7 Support</h3><p>Real human assistance on WhatsApp</p></div>
            <div class="feature-card"><i class="fas fa-money-bill-wave"></i><h3>Best Prices</h3><p>Competitive rates across all regions</p></div>
          </section>
          <div class="preview-label"><i class="fas fa-list-ul"></i> Popular destinations</div>
          <div class="country-strip">
            <span>🇰🇪 Kenya +254</span> <span>🇺🇬 Uganda +256</span> <span>🇹🇿 Tanzania +255</span>
            <span>🇳🇬 Nigeria +234</span> <span>🇺🇸 USA +1</span> <span>🇬🇧 UK +44</span>
          </div>
        </main>
      `;
    }

    // Router logic based on URL path
    function router() {
      const path = window.location.pathname.split("/").pop() || "index.html";
      const container = document.getElementById("page-content");
      if (!container) return;
      if (path === "pricing.html" || path === "pricing") {
        renderPricingPage("");
      } else if (path === "contact.html" || path === "contact") {
        renderContactPage();
      } else {
        renderHomePage();
      }
      // update active nav class
      document.querySelectorAll(".nav-link").forEach(link => {
        link.classList.remove("active-nav");
        const href = link.getAttribute("href");
        if ((path === "index.html" || path === "" || path === "/") && href === "index.html") link.classList.add("active-nav");
        else if (href === path) link.classList.add("active-nav");
        else if (path === "pricing.html" && href === "pricing.html") link.classList.add("active-nav");
        else if (path === "contact.html" && href === "contact.html") link.classList.add("active-nav");
      });
    }

    // Mobile menu toggle
    function initMobileMenu() {
      const menuBtn = document.getElementById("menuToggle");
      const navLinks = document.getElementById("navLinks");
      if (menuBtn && navLinks) {
        menuBtn.addEventListener("click", () => {
          navLinks.classList.toggle("show");
        });
        document.querySelectorAll(".nav-link").forEach(link => {
          link.addEventListener("click", () => navLinks.classList.remove("show"));
        });
      }
    }

    // on load & popstate
    window.addEventListener("DOMContentLoaded", () => {
      // create main content container if not exists
      if (!document.getElementById("page-content")) {
        const mainDiv = document.createElement("div");
        mainDiv.id = "page-content";
        const navbar = document.querySelector(".navbar");
        const footer = document.querySelector(".footer");
        navbar.insertAdjacentElement("afterend", mainDiv);
      }
      router();
      initMobileMenu();
    });

    window.addEventListener("popstate", () => router());

    // handle internal navigation for SPA-like smoothness but keep separate files? We'll preserve href for real pages but ensure same behavior
    // make buy links globally working also added manually, but any external link works
  </script>
</body>
