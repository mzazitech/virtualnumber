    document.getElementById('orderNowCyber')?.addEventListener('click', () => navigateTo('pricing'));

  function renderPricing(search = "") {
    const root = document.getElementById('app-root');
    const filtered = countries.filter(c => 
      c.name.toLowerCase().includes(search.toLowerCase()) || c.code.includes(search)

    const cards = filtered.map(c => `

        <div style="text-align:right">

          <button class="buy-btn" data-name="${c.name}" data-code="${c.code}">BUY NOW →</button>

      </div>
    `).join('');
    const noResults = filtered.length === 0 ? `<div class="no-results"><i class="fas fa-dragon"></i> [ no match ]</div>` : '';
    root.innerHTML = `

        <div class="pricing-header">

    const searchInput = document.getElementById('searchCountry');
    if (searchInput) {
      searchInput.value = search;
      searchInput.addEventListener('input', (e) => renderPricing(e.target.value));
    }
    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', () => window.open(WA_LINK, '_blank'));
    });
    setActiveNav('pricing');
  }

  function renderContact() {
    const root = document.getElementById('app-root');
    root.innerHTML = `
      <div class="section">
        <div class="terminal-contact">
          <i class="fab fa-whatsapp"></i>
          <h3 style="margin-top:10px;">[ OPERATOR CHANNEL ]</h3>
          <div class="glitch-text">

          </div>
          <p style="font-weight:600; margin-top:15px;">MZAZI TECH VIRTUAL NUMBERS</p>
          <p style="font-size:0.8rem; margin:15px 0;">Direct encrypted line · 24/7 response</p>

        </div>
      </div>
    `;
    setActiveNav('contact');
  }

  // navigation state
  let currentPage = 'home';
  function navigateTo(page) {
    currentPage = page;
    if (page === 'home') renderHome();
    else if (page === 'pricing') renderPricing('');
    else if (page === 'contact') renderContact();
    const mobileNav = document.getElementById('navLinks');
    if (mobileNav && mobileNav.classList.contains('show')) mobileNav.classList.remove('show');
    window.history.pushState({ page }, '', `#${page}`);
  }

  function setActiveNav(page) {
    document.querySelectorAll('.nav-link').forEach(link => {
      const linkPage = link.getAttribute('data-page');
      if (linkPage === page) link.classList.add('active');
      else link.classList.remove('active');
    });
  }

  function handleRoute() {
    const hash = window.location.hash.slice(1);
    if (hash === 'pricing') navigateTo('pricing');
    else if (hash === 'contact') navigateTo('contact');
    else navigateTo('home');
  }

  function bindNavEvents() {
    document.querySelectorAll('[data-page]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const page = el.getAttribute('data-page');
        if (page) navigateTo(page);
      });
    });
  }

  function initMobile() {
    const menuBtn = document.getElementById('menuToggle');
    const navContainer = document.getElementById('navLinks');
    if (menuBtn && navContainer) {
      menuBtn.addEventListener('click', () => navContainer.classList.toggle('show'));
      document.querySelectorAll('.nav-link').forEach(l => {
        l.addEventListener('click', () => navContainer.classList.remove('show'));
      });
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    initMobile();
    bindNavEvents();
    handleRoute();
  });
  window.addEventListener('popstate', handleRoute);
</script>
